# Flatpak-Manifest für TANGENTA (siehe build-flatpak.sh).
# Laufzeit: KDE (Qt 6.10) von Flathub. libcdr, librevenge und Little CMS holt CMake beim Bauen
# (FetchContent mit festen Prüfsummen), deshalb darf der Bau ins Netz.
app-id: ch.tangenta.Tangenta
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: tangenta
rename-desktop-file: tangenta.desktop
rename-icon: tangenta
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # KI-Anbieter und Bildersuche
  - --share=network
  # Zeichnungen, Bilder und Schriften liegen überall im Benutzerordner
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=xdg-run/gvfs
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: tangenta
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DVEK_BUILD_TESTS=OFF
    build-options:
      build-args:
        - --share=network
    post-install:
      - install -Dm644 $FLATPAK_BUILDER_BUILDDIR/packaging/linux/tangenta-mime.xml /app/share/mime/packages/ch.tangenta.Tangenta.xml
      - install -Dm644 $FLATPAK_BUILDER_BUILDDIR/packaging/flatpak/ch.tangenta.Tangenta.metainfo.xml /app/share/metainfo/ch.tangenta.Tangenta.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - website
          - .flatpak-builder
